<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta | Natural App</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages.css"><link rel="stylesheet" href="css/responsive.css"></head><body data-page="register"><div id="app-loader" class="app-loader"><div class="app-loader__content">Cargando…</div></div><header id="site-header"></header><main class="auth-page"><section class="auth-card"><a class="brand" href="index.html"><i class="bi bi-flower1 me-2"></i>Natural App</a><h1 class="mt-4">Sé parte de la comunidad</h1><p>Tu aporte ayuda a preservar saberes de Villa Abecia.</p><form id="register-form" class="mt-4"><label class="form-label" for="name">Nombre completo</label><input id="name" class="form-control mb-3" required autocomplete="name"><label class="form-label" for="email">Correo electrónico</label><input id="email" class="form-control mb-3" type="email" required autocomplete="email"><label class="form-label" for="community">Comunidad</label><input id="community" class="form-control mb-3" value="Villa Abecia" required><label class="form-label" for="password">Contraseña</label><input id="password" class="form-control mb-3" type="password" minlength="8" required autocomplete="new-password"><label class="form-label" for="password-confirm">Confirmar contraseña</label><input id="password-confirm" class="form-control" type="password" minlength="8" required autocomplete="new-password"><button class="btn btn-primary w-100 mt-4" type="submit">Crear mi cuenta <i class="bi bi-arrow-right"></i></button></form><p class="text-center mt-4 mb-0">¿Ya tienes cuenta? <a class="text-link" href="login.html">Iniciar sesión</a></p></section></main><footer id="site-footer"></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script type="module" src="js/app.js"></script></body></html>
